<title>Grade 4 Science Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one column "lab notebook" — home grid of unit cards, then focused one-question-at-a-time cards. Each unit carries its own colour. */
:root{
  --bg:#EEF3F6; --surface:#FFFFFF; --sunk:#F5F8FA; --ink:#14232E; --muted:#56687A; --line:#D5DEE5;
  --primary:#24489B; --primary-ink:#FFFFFF;
  --leaf:#2E8A4C; --sound:#6A4CCF; --matter:#1C78B0; --gut:#C9512F;
  --ok:#1E8A50; --ok-bg:#E3F5EA; --bad:#C23B3B; --bad-bg:#FBE7E7; --warn:#B7791F;
  --fig-sky:#DDEEFA; --fig-sea:#5FA8D8; --fig-land:#9DBB7A; --fig-sun:#F2B632; --fig-cloud:#FFFFFF; --fig-body:#F3E2D3;
  --petal:#E86FA0; --stem:#3E9A57; --organ-a:#E7836B; --organ-b:#E9B24C; --organ-c:#C9667B;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#17212A; --sunk:#1D2933; --ink:#E5EDF3; --muted:#9AAABA; --line:#2C3A46;
  --primary:#7EA2F2; --primary-ink:#0E151B;
  --leaf:#5BC27C; --sound:#A28BF0; --matter:#5BB3E6; --gut:#F08A66;
  --ok:#5BD08D; --ok-bg:#163526; --bad:#F27D7D; --bad-bg:#3A1C1F; --warn:#E6B65C;
  --fig-sky:#1E3346; --fig-sea:#2F6E99; --fig-land:#4F6B3B; --fig-sun:#E0A52A; --fig-cloud:#C9D6E2; --fig-body:#3A2E26;
  --petal:#D9608F; --stem:#4FAE69; --organ-a:#D9715A; --organ-b:#D9A23F; --organ-c:#B9586D;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#17212A; --sunk:#1D2933; --ink:#E5EDF3; --muted:#9AAABA; --line:#2C3A46;
  --primary:#7EA2F2; --primary-ink:#0E151B;
  --leaf:#5BC27C; --sound:#A28BF0; --matter:#5BB3E6; --gut:#F08A66;
  --ok:#5BD08D; --ok-bg:#163526; --bad:#F27D7D; --bad-bg:#3A1C1F; --warn:#E6B65C;
  --fig-sky:#1E3346; --fig-sea:#2F6E99; --fig-land:#4F6B3B; --fig-sun:#E0A52A; --fig-cloud:#C9D6E2; --fig-body:#3A2E26;
  --petal:#D9608F; --stem:#4FAE69; --organ-a:#D9715A; --organ-b:#D9A23F; --organ-c:#B9586D;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding-top:4px}
.top h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.01em}
.top h1 span{color:var(--primary)}
.namebox{display:flex;flex-direction:column;gap:4px;min-width:0}
.namebox label{font-size:13px;color:var(--muted)}
.namebox input{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;width:220px;max-width:100%}

/* home */
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:620px){.units{grid-template-columns:1fr}}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.ucard .tag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--u)}
.ucard .tag i{width:10px;height:10px;border-radius:50%;background:var(--u)}
.ucard h2{font-size:21px}
.ucard p{margin:0;color:var(--muted);font-size:14px}
.ucard .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.ucard .meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.ucard .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.ucard svg.mark{position:absolute;right:-8px;top:-8px;width:84px;height:84px;opacity:.14;color:var(--u)}
.mixed{background:var(--primary);color:var(--primary-ink);border-radius:var(--r);padding:20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.mixed h2{font-size:22px}
.mixed p{margin:4px 0 0;opacity:.85;font-size:14px}
.mixed .btn{background:var(--primary-ink);color:var(--primary);border-color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:600;font-size:15px;min-height:42px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--u,var(--primary));border-color:var(--u,var(--primary));color:#fff}
:root[data-theme="dark"] .btn.primary{color:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:var(--bg)}}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent}

.howto{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px 18px;font-size:14px;color:var(--muted)}
.howto b{color:var(--ink)}

/* screen header */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .back{border:none;background:transparent;color:var(--muted);font-weight:600;padding:6px 0}
.bar .back:hover{color:var(--ink)}
.bar .title{display:flex;flex-direction:column;min-width:0;flex:1}
.bar .title b{font-family:var(--display);font-size:20px;line-height:1.2}
.bar .title small{color:var(--u);font-weight:600;font-size:13px}
.score{font-variant-numeric:tabular-nums;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--u);border-radius:99px;transition:width .3s}

/* question card */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,28px);display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qhead .kind{font-weight:600;color:var(--u);text-transform:uppercase;letter-spacing:.07em;font-size:12px}
.qtext{font-family:var(--body);font-weight:600;font-size:clamp(18px,2.6vw,21px);line-height:1.4}
.fig{background:var(--sunk);border-radius:12px;padding:12px;overflow-x:auto;display:flex;justify-content:center}
.fig svg{max-width:100%;height:auto;display:block}
.fig table{border-collapse:collapse;font-size:15px;background:var(--surface);font-variant-numeric:tabular-nums}
.fig th,.fig td{border:1px solid var(--line);padding:7px 14px;text-align:center}
.fig th{background:var(--sunk);font-weight:600}
.fig td.l,.fig th.l{text-align:left}
.bank{display:flex;flex-wrap:wrap;gap:6px;font-size:14px}
.bank span{border:1px dashed var(--u);color:var(--u);border-radius:8px;padding:2px 10px}

.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--sunk);border:2px solid transparent;border-radius:12px;padding:12px 14px;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--line)}
.opt .key{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface);font-weight:600;font-size:14px;border:1px solid var(--line)}
.opt.sel{border-color:var(--u);background:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}

.fillrow input{width:100%;max-width:420px;border:2px solid var(--line);background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:17px}
.fillrow input:focus{border-color:var(--u);outline:none}
input.right{border-color:var(--ok)!important;background:var(--ok-bg)!important}
input.wrong{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.hint{margin:0;color:var(--muted);font-size:14px}

.seq{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px;min-height:48px;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.slot.filled{border-style:solid;border-color:var(--u);background:var(--surface)}
.slot .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.slot.right{border-color:var(--ok);background:var(--ok-bg)}
.slot.wrong{border-color:var(--bad);background:var(--bad-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--u);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:500}
.chip:hover{background:var(--sunk)}

.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;background:var(--sunk);border-radius:12px;padding:10px 12px;border:2px solid transparent}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
.mrow .ml{font-weight:500}
.mrow select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;min-height:42px}
.mrow.right{border-color:var(--ok);background:var(--ok-bg)}
.mrow.wrong{border-color:var(--bad);background:var(--bad-bg)}

.sort{display:grid;gap:8px}
.srow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;background:var(--sunk);border-radius:12px;padding:8px 12px;border:2px solid transparent}
.srow .st{font-weight:500;min-width:0;flex:1 1 180px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 14px;font-size:14px;font-weight:500}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--u);color:var(--surface)}
.srow.right{border-color:var(--ok);background:var(--ok-bg)}
.srow.wrong{border-color:var(--bad);background:var(--bad-bg)}

.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.fb.good{background:var(--ok-bg);border:1.5px solid var(--ok)}
.fb.part{background:var(--sunk);border:1.5px solid var(--warn)}
.fb.miss{background:var(--bad-bg);border:1.5px solid var(--bad)}
.fb strong{font-family:var(--display);font-size:18px}
.fb.good strong{color:var(--ok)} .fb.miss strong{color:var(--bad)} .fb.part strong{color:var(--warn)}
.fb .ans b{font-weight:600}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* learn */
.ideas{display:grid;gap:14px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.idea h3{font-size:18px;margin-bottom:8px;color:var(--u)}
.idea ul{margin:0;padding-left:20px;display:grid;gap:4px}
.idea li::marker{color:var(--u)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.flow span{background:var(--sunk);border-radius:8px;padding:4px 10px;font-size:14px;font-weight:500}
.flow em{font-style:normal;color:var(--u);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.fcard{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:6px}
.fcard .term{font-family:var(--display);font-size:17px;font-weight:600}
.fcard .def{font-size:14px;color:var(--muted)}
.fcard[aria-expanded="false"] .def{display:none}
.fcard[aria-expanded="false"]::after{content:"Tap to see meaning";font-size:12px;color:var(--u);margin-top:auto}
.fcard[aria-expanded="true"]{border-color:var(--u)}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sechead h2{font-size:22px}

/* results */
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,5vw,32px);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.res .big{font-family:var(--display);font-weight:800;font-size:clamp(48px,10vw,72px);line-height:1;color:var(--u);font-variant-numeric:tabular-nums}
.res .big small{font-size:.4em;color:var(--muted);font-weight:600}
.stars{display:flex;gap:6px}
.stars svg{width:34px;height:34px}
.stars .on{fill:var(--fig-sun)} .stars .off{fill:var(--line)}
.review{display:grid;gap:10px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:12px 16px;font-size:15px}
.rv.part{border-left-color:var(--warn)}
.rv p{margin:4px 0 0;color:var(--muted)}
.rv b{color:var(--ink)}

/* svg figure classes */
.s-line{stroke:var(--ink);fill:none;stroke-width:1.5}
.s-lab{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.s-num{fill:var(--ink);font:600 13px var(--body);text-anchor:middle;dominant-baseline:central}
.s-txt{fill:var(--ink);font:500 12px var(--body)}
.s-muted{fill:var(--muted);font:500 11px var(--body)}
.s-petal{fill:var(--petal)} .s-stem{fill:var(--stem)} .s-stemline{stroke:var(--stem);stroke-width:8;fill:none;stroke-linecap:round}
.s-ovary{fill:var(--organ-b);stroke:var(--ink);stroke-width:1} .s-ovule{fill:var(--surface)}
.s-anther{fill:var(--organ-b);stroke:var(--ink);stroke-width:1}
.s-fil{stroke:var(--muted);stroke-width:3;fill:none}
.s-body{fill:var(--fig-body)}
.s-tube{stroke:var(--organ-a);fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-stom{fill:var(--organ-c)}
.s-li{stroke:var(--organ-b);fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-wave{stroke:var(--u);stroke-width:3;fill:none}
.s-axis{stroke:var(--line);stroke-width:1.5}
.s-sky{fill:var(--fig-sky)} .s-sea{fill:var(--fig-sea)} .s-land{fill:var(--fig-land)} .s-sun{fill:var(--fig-sun)} .s-cloud{fill:var(--fig-cloud);stroke:var(--muted);stroke-width:1}
.s-arrow{stroke:var(--ink);stroke-width:2;fill:none}
.s-rain{stroke:var(--fig-sea);stroke-width:2.5;stroke-linecap:round}
.s-bar{fill:var(--u)}
.s-grid{stroke:var(--line);stroke-width:1}
.s-head{fill:var(--ink)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
footer{font-size:12px;color:var(--muted);text-align:center}
</style>

<div class="wrap" id="app"></div>

<script>
/* ------------------------------------------------------------------ */
/*  CONTENT — Cambridge Primary Science, Grade 4, Nguyen Sieu School   */
/* ------------------------------------------------------------------ */
const UNITS = [
{
  id:"u1", code:"Unit 1", color:"--leaf",
  title:"Flowering and non-flowering plants",
  blurb:"Flower parts, pollination, life cycle, seed dispersal and germination.",
  icon:'<svg class="mark" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7" r="4"/><circle cx="7" cy="11" r="4"/><circle cx="17" cy="11" r="4"/><circle cx="12" cy="15" r="4"/></svg>',
  ideas:[
    {h:"Parts of a flower", li:[
      "<b>Petals</b>: often brightly coloured to attract insects.",
      "<b>Sepals</b>: green, leaf-like parts that protect the flower bud.",
      "<b>Stamen</b> (male part) = <b>anther</b> + <b>filament</b>. The anther makes pollen; the filament is the stalk that holds up the anther.",
      "<b>Carpel</b> (female part) = <b>stigma</b> + <b>style</b> + <b>ovary</b>. The stigma is sticky to catch pollen. The ovary contains <b>ovules</b>.",
      "After fertilisation: the <b>ovules become seeds</b> and the <b>ovary becomes the fruit</b>."]},
    {h:"Pollination", li:[
      "<b>Pollination</b> is when pollen moves from an anther to a stigma.",
      "<b>Insect-pollinated</b> flowers: big, bright petals, sweet scent, nectar, sticky pollen; anthers and stigma inside the flower.",
      "<b>Wind-pollinated</b> flowers: small, dull petals (or none), no scent or nectar, anthers and feathery stigmas hang outside, lots of light pollen.",
      "<b>Fertilisation</b> is when the male cell from pollen joins with the female cell in the ovule."]},
    {h:"Flowering and non-flowering plants", li:[
      "Flowering plants (rose, mango, sunflower) reproduce with flowers and make seeds inside fruits.",
      "Non-flowering plants reproduce by <b>spores</b> (ferns, mosses) or <b>cones</b> (conifers such as pine trees)."]},
    {h:"Life cycle of a flowering plant", flow:["Germination","Growth","Pollination","Fertilisation","Seed formation","Seed dispersal"]},
    {h:"Seed dispersal", li:[
      "<b>Wind</b>: light seeds with wings or parachutes (sycamore, dandelion).",
      "<b>Water</b>: fruits with a spongy or fibrous covering that floats (coconut).",
      "<b>Animals</b>: hooks and spines stick to fur or clothes (burdock); soft, tasty fruits are eaten (cherry, mango).",
      "<b>Explosion</b>: pods dry, split open and throw the seeds out (pea, bean).",
      "<b>Drop and roll</b>: heavy fruits fall and roll away (horse chestnut)."]},
    {h:"Germination", li:[
      "Seeds need <b>water</b>, <b>warmth</b> (the right temperature) and <b>air</b> to germinate. They do not need light.",
      "Order: the seed absorbs water and swells → the root grows downwards → the shoot grows upwards → the first leaves appear and start to make food → the food store shrivels."]},
    {h:"Fair tests", li:[
      "<b>Independent variable</b>: the one thing you change.",
      "<b>Dependent variable</b>: the thing you measure or observe.",
      "<b>Control variables</b>: things you keep the same to make the test fair.",
      "We measure temperature with a <b>thermometer</b>."]}
  ],
  words:[
    ["Pollination","Pollen moves from an anther to a stigma."],
    ["Fertilisation","The male cell in pollen joins the female cell in the ovule."],
    ["Germination","When a seed starts to grow into a new plant."],
    ["Seed dispersal","Seeds are carried away from the parent plant."],
    ["Spore","A tiny cell that ferns and mosses use to reproduce."],
    ["Anther","Part of the stamen that makes pollen."],
    ["Stigma","Sticky top of the carpel that catches pollen."],
    ["Ovule","Inside the ovary; becomes a seed after fertilisation."],
    ["Ovary","Holds the ovules; becomes the fruit."],
    ["Sepal","Protects the flower bud."]
  ],
  qs:[
    {t:"match", fig:"flower", q:"Label the parts of the flower. Choose the name for each number.",
      pairs:[["1","Petal"],["2","Sepal"],["3","Anther"],["4","Filament"],["5","Stigma"],["6","Style"],["7","Ovary"]],
      ex:"Stamen = anther + filament. Carpel = stigma + style + ovary."},
    {t:"mcq", q:"Which part of the flower forms the <b>seed</b> after fertilisation?", o:["Ovule","Anther","Petal","Sepal"], a:0, ex:"The ovules (inside the ovary) become seeds."},
    {t:"mcq", q:"Which part of the flower forms the <b>fruit</b> after fertilisation?", o:["Ovary","Stigma","Filament","Petal"], a:0, ex:"The ovary grows into the fruit that holds the seeds."},
    {t:"match", q:"Match each description with the flower part.",
      pairs:[["The female part of a flower","Carpel"],["The male part of a flower","Stamen"],["Protects the flower bud","Sepal"],["Produces pollen grains","Anther"],["The stalk that holds the anther","Filament"],["The sticky part that catches pollen","Stigma"]],
      ex:"Carpel = female. Stamen = male."},
    {t:"sort", q:"Is each feature found in an insect-pollinated flower or a wind-pollinated flower?", bins:["Insect","Wind"],
      items:[["Big, brightly coloured petals",0],["Sweet scent",0],["Makes nectar",0],["Anthers hang outside the flower",1],["Feathery stigma",1],["Small, dull petals or no petals",1],["Lots of very light pollen",1],["Sticky pollen",0]],
      ex:"Insect flowers attract insects with colour, scent and nectar. Wind flowers hang their anthers and stigmas out in the wind."},
    {t:"sort", q:"Flowering plant or non-flowering plant?", bins:["Flowering","Non-flowering"],

function lab(n,x,y,tx,ty){ // leader line from part (x,y) to number circle (tx,ty)
  return `<line class="s-line" x1="${x}" y1="${y}" x2="${tx}" y2="${ty}"/><circle class="s-lab" cx="${tx}" cy="${ty}" r="12"/><text class="s-num" x="${tx}" y="${ty}">${n}</text>`;
}
function sine(x0,y0,w,amp,cycles){
  let d=`M${x0},${y0}`; const steps=240;
  for(let i=1;i<=steps;i++){const x=x0+w*i/steps; const y=y0-amp*Math.sin(2*Math.PI*cycles*i/steps); d+=` L${x.toFixed(1)},${y.toFixed(1)}`;}
  return d;
}

const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=s=>String(s).replace(/<[^>]+>/g,"");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const store={get(k,d){try{const v=localStorage.getItem("g4sci:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem("g4sci:"+k,JSON.stringify(v));}catch(e){}}};
const norm=s=>String(s).toLowerCase().replace(/[.,!?'"()]/g,"").replace(/\s+/g," ").trim().replace(/^(the|a|an) /,"");
const unitById=id=>UNITS.find(u=>u.id===id);
const KIND={mcq:"Choose the answer",tf:"True or false",fill:"Write the answer",order:"Put in order",match:"Match",sort:"Sort"};
function maxOf(q){return q.t==="match"?q.pairs.length:q.t==="sort"?q.items.length:q.t==="order"?2:1;}
function answerText(q){
  if(q.t==="mcq") return esc(q.o[q.a]);
  if(q.t==="tf") return q.a?"True":"False";
  if(q.t==="fill") return esc(q.acc[0]);
  if(q.t==="order") return q.items.map(esc).join(" → ");
  if(q.t==="match") return q.pairs.map(p=>`${esc(p[0])} → <b>${esc(p[1])}</b>`).join("; ");
  if(q.t==="sort") return q.bins.map((b,bi)=>`<b>${esc(b)}:</b> ${q.items.filter(i=>i[1]===bi).map(i=>esc(i[0])).join(", ")}`).join("<br>");
  return "";
}
function setUnitColor(el,u){el.style.setProperty("--u",u?`var(${u.color})`:"var(--primary)");}
window.scrollTop=()=>{try{window.scrollTo({top:0,behavior:"instant"})}catch(e){window.scrollTo(0,0)}};

/* ------------------------------------------------------------------ */
/*  QUIZ                                                               */
/* ------------------------------------------------------------------ */
let S=null;
function startQuiz(key,title,qs){
  S={key,title,qs,i:0,got:0,total:0,results:[],answered:false,cur:{}};
  renderQ();
}
function renderQ(){
  const q=S.qs[S.i], u=unitById(q.unit);
  setUnitColor(app,S.key==="mix"?null:u);
  S.answered=false; S.cur={};
  const pct=Math.round(100*S.i/S.qs.length);
  app.innerHTML=`
  <div class="bar"><button class="back" id="back">← Stop</button><div class="title"><small>${esc(S.title)}</small><b>Question ${S.i+1} of ${S.qs.length}</b></div><span class="score">Score ${S.got} / ${S.total}</span></div>
  <div class="prog" aria-hidden="true"><i style="width:${pct}%"></i></div>
  <article class="qcard pop" style="--u:var(${u.color})">
    <div class="qhead"><span class="kind">${KIND[q.t]}</span><span>${u.code} · ${u.title}</span></div>
    <h2 class="qtext">${q.q}</h2>
    ${q.fig?`<div class="fig">${FIG[q.fig]()}</div>`:""}
    ${q.bank?`<div class="bank" aria-label="Word bank">${q.bank.map(w=>`<span>${w}</span>`).join("")}</div>`:""}
    <div id="ans"></div>
    <div id="fb" hidden></div>
    <div class="actions"><button class="btn primary" id="check" disabled>Check answer</button><button class="btn primary" id="next" hidden>${S.i+1<S.qs.length?"Next question →":"See my results"}</button></div>
  </article>`;
  $("#back").onclick=()=>{ if(S.total>0) results(); else home(); };
  $("#check").onclick=doCheck;
  $("#next").onclick=()=>{S.i++; if(S.i<S.qs.length) renderQ(); else results();};
  R[q.t](q,$("#ans"));
  scrollTop();
}
const enableCheck=on=>{const b=$("#check"); if(b) b.disabled=!on;};

function doCheck(){
  if(S.answered) return;
  const q=S.qs[S.i]; const r=S.cur.check(); S.answered=true;
  S.got+=r.got; S.total+=r.max; S.results.push({q,got:r.got,max:r.max});
  const fb=$("#fb"); fb.hidden=false;
  const cls=r.got===r.max?"good":r.got>0?"part":"miss";
  const head=r.got===r.max?(r.max>1?`Correct! +${r.got} marks`:"Correct!"):r.got>0?`Nearly! ${r.got} of ${r.max} marks`:"Not quite.";
  const showAns = r.got<r.max && !["mcq","tf"].includes(q.t) || (r.got<r.max && ["mcq","tf"].includes(q.t));
  fb.className="fb pop "+cls;
  fb.innerHTML=`<strong>${head}</strong>${showAns?`<div class="ans">Answer: ${answerText(q)}</div>`:""}${q.ex?`<div>${q.ex}</div>`:""}`;
  $("#check").hidden=true; const n=$("#next"); n.hidden=false; n.focus();
  $(".score").textContent=`Score ${S.got} / ${S.total}`;
}

const R={
  mcq(q,box){
    let opts=q.o.map((t,i)=>({t,i})); if(!q.keep) opts=shuffle(opts);
    const two=q.grid||opts.length===2;
    box.innerHTML=`<div class="opts ${two?"two":""}" role="group">${opts.map((o,k)=>`<button class="opt" data-i="${o.i}">${q.nokey?"":`<span class="key">${"ABCDEF"[k]}</span>`}<span>${esc(o.t)}</span></button>`).join("")}</div>`;
    let sel=null;
    $$(".opt",box).forEach(b=>b.onclick=()=>{if(S.answered)return;$$(".opt",box).forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=+b.dataset.i;enableCheck(true);});
    S.cur.check=()=>{$$(".opt",box).forEach(b=>{const i=+b.dataset.i;if(i===q.a)b.classList.add("right");else if(i===sel)b.classList.add("wrong");b.disabled=true;});return{got:sel===q.a?1:0,max:1};};
  },
  tf(q,box){ R.mcq({...q,o:["True","False"],a:q.a?0:1,keep:true,nokey:true},box); },
  fill(q,box){
    box.innerHTML=`<div class="fillrow"><label class="hint" for="fillin" style="display:block;margin-bottom:6px">Type your answer${q.hint?` · hint: <span style="letter-spacing:.06em">${esc(q.hint)}</span>`:""}</label><input id="fillin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type here"></div>`;
    const inp=$("#fillin",box);
    inp.oninput=()=>enableCheck(inp.value.trim().length>0);
    inp.onkeydown=e=>{if(e.key==="Enter"&&inp.value.trim()&&!S.answered){e.preventDefault();doCheck();}};
    S.cur.check=()=>{const v=norm(inp.value);const ok=q.acc.some(a=>norm(a)===v);inp.disabled=true;inp.classList.add(ok?"right":"wrong");return{got:ok?1:0,max:1};};
  },
  order(q,box){
    let pool=q.items.map((t,i)=>({t,i})); do{pool=shuffle(pool);}while(pool.every((p,k)=>p.i===k));
    const picked=[];
    const draw=()=>{
      box.innerHTML=`<p class="hint">Tap the cards below in the right order. Tap a filled box to take it back.</p>
      <ol class="seq">${q.items.map((_,k)=>{const p=picked[k];return `<li class="slot ${p?"filled":""}" data-k="${k}" tabindex="${p?0:-1}"><span class="n">${k+1}</span><span>${p?esc(p.t):""}</span></li>`;}).join("")}</ol>
      <div class="chips">${pool.filter(p=>!picked.includes(p)).map(p=>`<button class="chip" data-i="${p.i}">${esc(p.t)}</button>`).join("")}</div>`;
      $$(".chip",box).forEach(c=>c.onclick=()=>{if(S.answered)return;picked.push(pool.find(p=>p.i===+c.dataset.i));draw();});
      $$(".slot.filled",box).forEach(s=>{const f=()=>{if(S.answered)return;picked.splice(+s.dataset.k,1);draw();};s.onclick=f;s.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f();}};});
      enableCheck(picked.length===q.items.length);
    };
    draw();
    S.cur.check=()=>{let c=0;$$(".slot",box).forEach((s,k)=>{const ok=picked[k].i===k;if(ok)c++;s.classList.add(ok?"right":"wrong");});
      const n=q.items.length;return{got:c===n?2:c>=n/2?1:0,max:2};};
  },
  match(q,box){
    const rights=shuffle([...new Set(q.pairs.map(p=>p[1]))]);
    box.innerHTML=`<div class="match">${q.pairs.map((p,k)=>`<div class="mrow"><label class="ml" for="m${k}">${esc(p[0])}</label><select id="m${k}"><option value="">Choose…</option>${rights.map(r=>`<option>${esc(r)}</option>`).join("")}</select></div>`).join("")}</div>`;
    const sels=$$("select",box);
    sels.forEach(s=>s.onchange=()=>enableCheck(sels.every(x=>x.value)));
    S.cur.check=()=>{let c=0;sels.forEach((s,k)=>{const ok=s.value===q.pairs[k][1];if(ok)c++;s.disabled=true;s.closest(".mrow").classList.add(ok?"right":"wrong");});return{got:c,max:q.pairs.length};};
  },
  sort(q,box){
    const items=shuffle(q.items.map((it,i)=>({t:it[0],b:it[1],i})));const ans={};
    box.innerHTML=`<p class="hint">Choose a group for every item.</p><div class="sort">${items.map(it=>`<div class="srow" data-i="${it.i}"><span class="st">${esc(it.t)}</span><span class="seg" role="group">${q.bins.map((b,bi)=>`<button data-b="${bi}" aria-pressed="false">${esc(b)}</button>`).join("")}</span></div>`).join("")}</div>`;
    $$(".srow",box).forEach(row=>$$("button",row).forEach(b=>b.onclick=()=>{if(S.answered)return;ans[row.dataset.i]=+b.dataset.b;$$("button",row).forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-pressed",x===b);});enableCheck(Object.keys(ans).length===items.length);}));
    S.cur.check=()=>{let c=0;$$(".srow",box).forEach(row=>{const it=q.items[+row.dataset.i];const ok=ans[row.dataset.i]===it[1];if(ok)c++;row.classList.add(ok?"right":"wrong");$$("button",row).forEach(x=>x.disabled=true);});return{got:c,max:q.items.length};};
  }
};

/* ------------------------------------------------------------------ */
/*  RESULTS                                                            */
/* ------------------------------------------------------------------ */
function results(){
  const pct=S.total?Math.round(100*S.got/S.total):0;
  const u=S.key==="mix"?null:unitById(S.key); setUnitColor(app,u);
  const finished=S.results.length===S.qs.length;
  if(finished&&!S.retry){const prev=store.get("best:"+S.key,null);if(prev==null||pct>prev)store.set("best:"+S.key,pct);}
  const stars=pct>=90?3:pct>=70?2:pct>=50?1:0;
  const name=store.get("name","");
  const msg=pct>=90?"Excellent work":pct>=70?"Great job":pct>=50?"Good effort":"Keep practising";
  const missed=S.results.filter(r=>r.got<r.max);
  const star=on=>`<svg viewBox="0 0 24 24"><path class="${on?"on":"off"}" d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>`;
  app.innerHTML=`
  <div class="bar"><button class="back" id="back">← All units</button></div>
  <section class="res pop">
    <div class="eyebrow">${esc(S.title)}${finished?"":" · stopped early"}</div>
    <div class="big">${pct}%<small> · ${S.got} / ${S.total} marks</small></div>
    <div class="stars" aria-label="${stars} of 3 stars">${star(stars>=1)}${star(stars>=2)}${star(stars>=3)}</div>
    <h2>${msg}${name?", "+esc(name):""}!</h2>
    <p style="margin:0;color:var(--muted)">${missed.length?`You have ${missed.length} question${missed.length>1?"s":""} to look at again. Read the answers below, then practise just those.`:"You got every question right."}</p>
    <div class="actions" style="justify-content:flex-start">
      ${missed.length?`<button class="btn primary" id="redo">Practise my mistakes (${missed.length})</button>`:""}
      <button class="btn" id="again">Try again</button>
      ${u?`<button class="btn ghost" id="learn">Read key ideas</button>`:""}
    </div>
  </section>
  ${missed.length?`<div class="sechead"><h2>Check these answers</h2></div><section class="review">${missed.map(r=>`<div class="rv ${r.got>0?"part":""}"><div>${strip(r.q.q)}</div><p><b>Answer:</b> ${answerText(r.q)}</p>${r.q.ex?`<p>${r.q.ex}</p>`:""}</div>`).join("")}</section>`:""}`;
  $("#back").onclick=home;
  const again=()=>{ if(S.key==="mix") $("#back").click(), setTimeout(()=>$("#mix")&&$("#mix").click(),0); else { const uu=unitById(S.key); startQuiz(uu.id,uu.code+" · "+uu.title,shuffle(uu.qs.map(q=>({...q,unit:uu.id})))); } };
  $("#again").onclick=again;
  if($("#redo")) $("#redo").onclick=()=>{const qs=shuffle(missed.map(r=>r.q));const k=S.key,t=S.title;startQuiz(k,t+" · mistakes",qs);S.retry=true;};
  if($("#learn")) $("#learn").onclick=()=>learn(u.id);
  scrollTop();
}

home();
</script>
